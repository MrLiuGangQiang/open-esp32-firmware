name: ACR Firmware Release

# 构建指定板型固件，打包为固件发布镜像并推送至阿里云 ACR。
# 镜像内含固件二进制与 esptool，可直接用于内网环境烧录。

on:
  workflow_dispatch:
    inputs:
      board:
        description: "板型目录（main/boards 下相对路径）"
        required: false
        default: "lckfb/szpi-esp32s3"
      variant:
        description: "板型构建变体名称"
        required: false
        default: "lichuang-dev"
      version:
        description: "镜像版本号（仅手动触发时使用）"
        required: false
        default: "dev"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: acr-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_IMAGE: liugangqiang/open-esp32-firmware

jobs:
  build-firmware:
    name: Build firmware (ESP-IDF release-v6.1)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build firmware
        shell: bash
        env:
          BOARD: ${{ inputs.board || 'lckfb/szpi-esp32s3' }}
          VARIANT: ${{ inputs.variant || 'lichuang-dev' }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          source "${IDF_PATH}/export.sh"
          python scripts/build.py "${BOARD}" --name "${VARIANT}"

      - name: Collect firmware images
        shell: bash
        run: |
          mkdir -p firmware-release
          cd build
          cp -v merged-binary.bin ../firmware-release/
          cp -v flash_args ../firmware-release/
          # 按 flash_args 引用路径原样收集各分区镜像（bootloader/partition_table 等）
          while read -r line; do
            for token in ${line}; do
              case "${token}" in
                *.bin) cp --parents -v "${token}" ../firmware-release/ ;;
              esac
            done
          done < flash_args
          cd ..
          ls -lahR firmware-release

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: firmware-release/
          if-no-files-found: error
          retention-days: 30

  release-acr:
    name: Package and push to ACR
    runs-on: ubuntu-latest
    needs: build-firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.build-firmware.outputs.version }}
          path: firmware-release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME || vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD || vars.ACR_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}
          tags: |
            type=raw,value=${{ needs.build-firmware.outputs.version }}

      - name: Build and push firmware image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.firmware
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false